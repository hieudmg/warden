name: Native Windows security checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: go1.26.11
      WARDEN_NATIVE_HTTPS_FIXTURE: '1'
    steps:
      - name: Check out native test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up complete Go patch for native Windows execution
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Execute nonempty named IPC, ACL, traversal and PowerShell HTTPS fixtures
        shell: powershell
        run: ./scripts/ci/test-windows.ps1
      - name: Retain native named-test evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-security-logs/
          if-no-files-found: warn
          retention-days: 7
